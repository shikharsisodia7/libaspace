<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#102c42"/><path d="M0 990C225 875 355 1130 576 1025S879 828 1080 955V1350H0Z" fill="#f1b55a"/><text x="76" y="145" fill="#f1b55a" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">JOB SEARCH NOTE</text><text x="76" y="315" fill="#fffdf7" font-family="Georgia, serif" font-size="82" font-weight="700">Students search</text><text x="76" y="410" fill="#fffdf7" font-family="Georgia, serif" font-size="82" font-weight="700">where everyone</text><text x="76" y="505" fill="#fffdf7" font-family="Georgia, serif" font-size="82" font-weight="700">else searches.</text><line x1="76" x2="1004" y1="610" y2="610" stroke="#fffdf7" stroke-opacity=".4"/><text x="76" y="700" fill="#fffdf7" font-family="Arial, sans-serif" font-size="35">Useful job-search work is not only browsing feeds.</text><text x="76" y="754" fill="#fffdf7" font-family="Arial, sans-serif" font-size="35">It is finding fresh, relevant openings early enough</text><text x="76" y="808" fill="#fffdf7" font-family="Arial, sans-serif" font-size="35">to decide whether your effort belongs there.</text><text x="76" y="1200" fill="#102c42" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">JOBNOVA / EARLY-CAREER JOB SEARCH</text></svg>
